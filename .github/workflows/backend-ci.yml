name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Run Ruff lint
        working-directory: .
        run: ruff check backend/app backend/tests

      - name: Run Bandit security scan
        working-directory: .
        run: bandit -r backend/app -lll -q

      - name: Audit Python dependencies
        working-directory: .
        # python-jose currently has advisories without a published fixed version.
        run: pip-audit -r backend/requirements.txt --ignore PYSEC-2026-4298 --ignore PYSEC-2026-1325

      - name: Verify risk model evaluation
        run: python -m app.services.ml.evaluate_model

      - name: Run integration tests
        run: pytest -q tests/test_api_integration.py

      - name: Run auth tests
        run: pytest -q tests/test_auth.py

      - name: Run portfolio tests
        run: pytest -q tests/test_portfolio.py

      - name: Run all tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75 tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
