[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".venv",
  "backend/data",
  "backend/uploads",
  "backend/downloads",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "B023", "B905", "E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
